[project]
name = "contract-processing-fastapi"
version = "0.1.0"
description = "FastAPI implementation of the contract-processing API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<0.116",
  "anyio>=4.0,<4.10",
  "uvicorn[standard]>=0.30,<1.0",
  "alembic>=1.13,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.1,<4.0",
  "celery[redis]>=5.3,<6.0",
  "pymongo>=4.6,<5.0",
  "azure-storage-blob>=12.19,<13.0",
  "azure-identity>=1.17,<2.0",
  "sentry-sdk>=2.0,<3.0",
  "ddtrace>=2.0,<4.0",
  "PyJWT[crypto]>=2.8,<3.0",
  "python-multipart>=0.0.9,<0.0.20",
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
